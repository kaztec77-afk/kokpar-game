<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101c28"><title>Көкпар — Тайқазан</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c28;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none}#hud .brand{font-weight:900;font-size:22px;letter-spacing:.4px;text-shadow:0 2px 8px #0008}#hud .score{background:#071521bb;border:1px solid #ffffff33;border-radius:16px;padding:9px 13px;font-size:14px}#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:#091622c9;border:1px solid #ffffff22;border-radius:20px;padding:10px 16px;text-align:center;white-space:nowrap;font-size:14px;color:#e5edf2;pointer-events:none}#message{position:fixed;top:23%;left:0;right:0;text-align:center;font-weight:1000;font-size:clamp(34px,10vw,60px);text-shadow:0 4px 0 #473115,0 7px 20px #000;opacity:0;pointer-events:none}#actions{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;flex-direction:column;gap:9px}button{border:1px solid #ffffff55;background:#122b3cdd;color:white;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:700}button:active{transform:scale(.97)}#note{position:fixed;top:65px;left:14px;right:14px;text-align:center;font-size:12px;color:#ffffffac;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="brand">🐎 КӨКПАР</div><div class="score">Салым: <b id="hits">0</b> / <b id="tries">0</b></div></div><div id="note">Қазақтың ұлттық ойыны · Тайқазан</div><div id="message"></div><div id="actions"><button id="sound">🔊 Звук</button><button id="reset">↻ Сброс</button></div><div id="hint">🐏 Проведи пальцем вверх, чтобы бросить</div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,scale=1,cx=0,cy=0;let hits=0,tries=0,muted=false,phase='ready',start=null,drag=null,anim=null,last=0,msgUntil=0,particles=[];const sheep={x:0,y:0};const $=id=>document.getElementById(id);const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/390,H/760);cx=W/2;cy=H*.43;if(phase==='ready')placeSheep()}function placeSheep(){sheep.x=cx;sheep.y=H*.81}addEventListener('resize',resize);function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function ellipse(x,y,rx,ry,fill,stroke,width=1){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}function poly(points,fill,stroke,width=1){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}function background(t){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#13283a');grad.addColorStop(.57,'#245068');grad.addColorStop(1,'#142b38');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#d7c08b';ctx.lineWidth=2;for(let i=0;i<9;i++){let y=H*(.15+i*.085);ctx.beginPath();for(let x=0;x<W+10;x+=8){let yy=y+Math.sin(x*.035+i*2.4)*5; if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke()}ctx.restore();let ground=H*.64;ctx.fillStyle='#c3a073';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#b38b60';for(let i=0;i<70;i++){let x=(i*67.31)%W,y=ground+((i*97.13)%(H-ground));ellipse(x,y,1.5,1,'#d5b48a')}ctx.save();ctx.translate(cx,ground-6);ctx.globalAlpha=.3;for(let s of [-1,1]){ctx.strokeStyle='#e4cda7';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s*90,0);ctx.lineTo(s*115,-65);ctx.lineTo(s*92,-128);ctx.lineTo(s*118,-170);ctx.stroke()}ctx.restore()}
function cauldron(back=true){ctx.save();ctx.translate(cx,cy);let s=scale*1.15;ctx.scale(s,s);ellipse(0,109,125,18,'#0005');poly([[-92,-20],[-80,76],[-54,100],[54,100],[80,76],[92,-20]],'#786046','#d2a967',4);let g=ctx.createLinearGradient(-95,0,95,0);g.addColorStop(0,'#513b2a');g.addColorStop(.22,'#a98754');g.addColorStop(.5,'#e2bd76');g.addColorStop(.8,'#8e683c');g.addColorStop(1,'#463324');poly([[-89,-15],[-74,66],[-49,91],[49,91],[74,66],[89,-15]],g,'#e3bd76',3);for(let k=-2;k<=2;k++){let x=k*28;ctx.strokeStyle='#4e3c29';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,-1);ctx.quadraticCurveTo(x*1.1,45,x*.65,83);ctx.stroke()}ellipse(0,-19,98,30,'#c59d5c','#f4d294',5);ellipse(0,-20,84,22,'#181c22','#382c21',3);if(!back){ctx.beginPath();ctx.ellipse(0,-20,98,30,0,0,Math.PI);ctx.strokeStyle='#f4d294';ctx.lineWidth=7;ctx.stroke();ctx.beginPath();ctx.ellipse(0,-20,84,22,0,0,Math.PI);ctx.strokeStyle='#7c5835';ctx.lineWidth=4;ctx.stroke()}ctx.restore()}
function drawSheep(x,y,size=1,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(size*scale,size*scale);ellipse(0,25,39,8,'#0004');ellipse(-1,0,43,30,'#e9e8e0','#bfc4c5',2);for(let i=0;i<10;i++){let a=i*Math.PI*2/10;ellipse(Math.cos(a)*33,Math.sin(a)*22,13,13,'#fff','#d8d8d2',1)}for(let dx of [-22,22]){ellipse(dx,26,7,17,'#e6dfd5','#a8a7a0',2);ellipse(dx,39,8,4,'#53473d')}ellipse(35,-7,22,19,'#f5f2e8','#c2bcb0',2);ellipse(38,-2,14,10,'#d9cbbd');ellipse(46,-13,3.2,3.5,'#242323');ellipse(27,-25,10,6,'#e9d4cb','#b6a8a1',1);ellipse(52,-1,4,3,'#574c45');ctx.restore()}
function burst(){for(let i=0;i<32;i++)particles.push({x:cx+rnd(-30,30),y:cy-30,vx:rnd(-3,3),vy:rnd(-6,-1),life:rnd(40,75),color:['#ffd166','#f4e1a1','#ffffff','#eeb95a'][i%4]})}function textMsg(s,good){$('message').textContent=s;$('message').style.color=good?'#ffe9a6':'#f7e3cb';$('message').style.opacity=1;msgUntil=performance.now()+1100}function audio(good){if(muted)return;try{let ac=new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),gain=ac.createGain();o.type=good?'sine':'triangle';o.frequency.setValueAtTime(good?440:220,ac.currentTime);o.frequency.exponentialRampToValueAtTime(good?780:140,ac.currentTime+.23);gain.gain.setValueAtTime(.12,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.32);o.connect(gain);gain.connect(ac.destination);o.start();o.stop(ac.currentTime+.33);setTimeout(()=>ac.close(),600)}catch(e){}}
function throwSheep(power=1){if(phase!=='ready')return;phase='flight';tries++;$('tries').textContent=tries;const good=Math.random()<.62;let destX=good?cx+rnd(-27,27):cx+(Math.random()<.5?-1:1)*rnd(125,190)*scale;let destY=good?cy-24*scale:cy+rnd(35,115)*scale;anim={t:0,duration:850,p0:{x:sheep.x,y:sheep.y},dest:{x:destX,y:destY},good,rotation:rnd(-.7,.7),power};$('hint').textContent='🐏 Барашек летит…'}function endThrow(){let good=anim.good;if(good){hits++;$('hits').textContent=hits;burst();textMsg('САЛЫМ! 🎉',true)}else{textMsg('Мимо!',false)}audio(good);phase='wait';setTimeout(()=>{phase='ready';anim=null;placeSheep();$('hint').textContent='🐏 Проведи пальцем вверх, чтобы бросить'},1150)}
function draw(t){let dt=Math.min((t-last)/16.67,3)||1;last=t;ctx.clearRect(0,0,W,H);background(t);cauldron(true);if(phase==='ready'){let x=drag?drag.x:sheep.x,y=drag?Math.min(drag.y,sheep.y):sheep.y;drawSheep(x,y,1.04,drag?(x-sheep.x)*.002:Math.sin(t*.002)*.03);if(drag){ctx.strokeStyle='#fff8';ctx.setLineDash([7,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sheep.x,sheep.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([])}}else if(anim&&phase==='flight'){anim.t+=dt*16.67/anim.duration;let p=Math.min(anim.t,1),q=1-p;let x=q*q*anim.p0.x+2*q*p*(cx+40*scale)+p*p*anim.dest.x;let y=q*q*anim.p0.y+2*q*p*(cy-200*scale)+p*p*anim.dest.y;drawSheep(x,y,1.05-p*.55,p*Math.PI*2+anim.rotation);if(p>=1)endThrow()}else if(phase==='wait'&&anim&&!anim.good){drawSheep(anim.dest.x,anim.dest.y,0.65,1.4)}cauldron(false);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.13*dt;p.life-=dt;ctx.globalAlpha=Math.min(1,p.life/25);ellipse(p.x,p.y,3.5,3.5,p.color);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}if(t>msgUntil)$('message').style.opacity=0;requestAnimationFrame(draw)}function pos(e){return{x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{if(phase!=='ready')return;start=pos(e);drag=pos(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!start)return;drag=pos(e)});canvas.addEventListener('pointerup',e=>{if(!start)return;let dy=start.y-e.clientY;start=null;drag=null;if(dy>25||Math.abs(dy)<15)throwSheep();else $('hint').textContent='Проведи пальцем вверх 🐏'});canvas.addEventListener('pointercancel',()=>{start=null;drag=null});$('reset').onclick=()=>{hits=0;tries=0;$('hits').textContent=0;$('tries').textContent=0;phase='ready';anim=null;placeSheep();$('hint').textContent='🐏 Проведи пальцем вверх, чтобы бросить'};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Без звука':'🔊 Звук'};resize();requestAnimationFrame(draw)})();
</script></body></html>
